# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Deploys the A2A peer (not the coordinator): a Foundry hosted agent that the
# AgentCore coordinator calls over A2A v1.0. Run azd from this directory.
#
# The responses protocol is required — Foundry only allows incoming A2A on
# hosted agents that implement it. Enabling A2A itself is a separate PATCH;
# see ../infra/enable_foundry_a2a.py.

name: bedrock-foundry-a2a-currency
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 50
                name: GlobalStandard
    currency-a2a-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              # This service owns the deployment above, so its stable deployment
              # name is configuration, not an azd environment output. Referencing
              # an unset azd value registers an empty variable and the container
              # fails its readiness check before FoundryChatClient can start.
              value: gpt-5-mini
            - name: CURRENCY_RATE_PROVIDER
              value: ${CURRENCY_RATE_PROVIDER}
        kind: hosted
        name: currency-a2a-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
